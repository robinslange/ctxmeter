[package]
name = "ctxmeter"
version = "0.1.2"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "Measure what an LLM coding agent actually bills you, and what compaction destroys, from your own transcripts."

[dependencies]
clap = { version = "4", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
walkdir = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
lto = true
codegen-units = 1
strip = true
